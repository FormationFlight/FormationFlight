name: Build FormationFlight
permissions: write-all
on:
  push:
    branches: [master]
    tags:
      - v*
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - id: set-targets
      run: echo "targets=[$( (grep '\[env:.*UART\]' targets/*.ini) | sed 's/.*://' | sed s/.$// | egrep "(STLINK|UART)" | grep -v DEPRECATED | sed s/\]$// | tr '\n' ','  | sed 's/,$/"\n/' | sed 's/,/","/'g | sed 's/^/"/')]" >> $GITHUB_OUTPUT && cat $GITHUB_OUTPUT

  build:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{fromJSON(needs.targets.outputs.targets)}}
    runs-on: ubuntu-latest
    steps:

    - name: Inject slug/short variables
      uses: rlespinasse/github-slug-action@v4.4.1

    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.target }}

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        pip install wheel

    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio

    # Each env leaves exactly what the web installer needs in
    # $BUILD_DIR/release (package_release() in scripts/env_setup.py): the
    # image, and on the ESP32 family its own bootloader and partition table,
    # named per env so an ESP32, a C3 and an S3 never overwrite each other's.
    - name: Run PlatformIO
      run: |
        platformio pkg install --platform native
        platformio pkg update
        pio run -e ${{ matrix.target }}
        mkdir -p ~/artifacts
        cp .pio/build/${{ matrix.target }}/release/* ~/artifacts/
        OUTNAME=`echo ${{ matrix.target }} | sed s/_via.*//`
        # The ESP8266 OTA image, for the node's own update page.
        cp .pio/build/${{ matrix.target }}/firmware.bin.gz ~/artifacts/$OUTNAME.bin.gz >& /dev/null || :

    - name: Store Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ strategy.job-index }}
        path: ~/artifacts/**

  # One index.json for the whole build: every board the installer can flash
  # from it, and what to append to the image for each. Needs every env, so it
  # runs once, after all of them.
  index:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Download Artifacts
      id: download
      uses: actions/download-artifact@v4
      with:
        path: ~/artifacts/
        pattern: firmware-*
        merge-multiple: true

    - name: Build installer index
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then VERSION="${{ github.ref_name }}"; else VERSION=development; fi
        python scripts/flasher_manifest.py ~/artifacts --version "$VERSION" --commit "${GITHUB_SHA::7}"

    - name: Store Release
      uses: actions/upload-artifact@v4
      with:
        name: release
        path: ~/artifacts/**

  release:
    runs-on: ubuntu-latest
    needs: [index]
    if: startsWith(github.event.ref, 'refs/tags/v')
    steps:
    - name: Download Release
      id: download
      uses: actions/download-artifact@v4
      with:
        path: ~/artifacts/
        name: release
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: ${{ steps.download.outputs.download-path }}/*

  # Every push to master refreshes one rolling prerelease, tagged
  # `development`, which the web installer offers as its development channel.
  # Deleted and recreated rather than edited, so its assets are never a mix of
  # two builds.
  development:
    runs-on: ubuntu-latest
    needs: [index]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
    - name: Download Release
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
        name: release
    - name: Publish development prerelease
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete development --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
        gh release create development artifacts/* \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --prerelease \
          --title "Development build" \
          --notes "Built from ${GITHUB_SHA::7} on master. Not a release: for testing, and flashable from the web installer's development channel."
