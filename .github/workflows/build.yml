name: Build FormationFlight
permissions: write-all
on:
  push:
    branches: [master]
    tags:
      - v*
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - id: set-targets
      run: echo "targets=[$( (grep '\[env:.*UART\]' targets/*.ini) | sed 's/.*://' | sed s/.$// | egrep "(STLINK|UART)" | grep -v DEPRECATED | sed s/\]$// | tr '\n' ','  | sed 's/,$/"\n/' | sed 's/,/","/'g | sed 's/^/"/')]" >> $GITHUB_OUTPUT && cat $GITHUB_OUTPUT

  build:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{fromJSON(needs.targets.outputs.targets)}}
    runs-on: ubuntu-latest
    steps:

    - name: Inject slug/short variables
      uses: rlespinasse/github-slug-action@v4.4.1

    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.target }}

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        pip install wheel

    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio

    - name: Run PlatformIO
      run: |
        mkdir -p ~/artifacts/firmware
        platformio pkg install --platform native
        platformio pkg update
        pio run -e ${{ matrix.target }}
        OUTNAME=`echo ${{ matrix.target }} | sed s/_via.*//`
        mkdir -p ~/artifacts/
        mv .pio/build/${{ matrix.target }}/firmware.bin ~/artifacts/$OUTNAME.bin >& /dev/null || :
        # also copy the .bin.gz if it exists
        mv .pio/build/${{ matrix.target }}/firmware.bin.gz ~/artifacts/$OUTNAME.bin.gz >& /dev/null || :
        # copy the common ESP32 files
        if [[ ${{matrix.target}} == *esp32* ]] ; then
         cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin ~/artifacts/firmware/
         mv .pio/build/${{ matrix.target }}/partitions.bin ~/artifacts/firmware/
         mv .pio/build/${{ matrix.target }}/bootloader.bin ~/artifacts/firmware/bootloader_dio_40m.bin
        fi

    - name: Store Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ strategy.job-index }}
        path: ~/artifacts/**
      continue-on-error: true

  # Follow test suite -- off-hardware, additive alongside the per-target
  # firmware build matrix above, not a replacement for it.
  test-native:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-test-native

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio

    - name: Run Follow test suite (native)
      run: |
        platformio pkg install --platform native
        pio test -e test_native

  test-follow-logic-js:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run follow-logic.js tests
      run: node --test test/follow-logic.test.js

  # test_mock_server.py is the third leg of the cross-mirror fixture
  # (alongside test-native and test-follow-logic-js above) -- leaving it out
  # of CI would let it silently drift the same way the fixture itself
  # exists to prevent.
  test-mock-server-py:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run mock_server.py validate_config() tests
      run: python3 test/test_mock_server.py

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.event.ref, 'refs/tags/v')
    steps:
    - name: Download Artifacts
      id: download
      uses: actions/download-artifact@v4
      with:
        path: ~/artifacts/
        pattern: firmware-*
        merge-multiple: true
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ${{ steps.download.outputs.download-path }}/*
          ${{ steps.download.outputs.download-path }}/firmware/*
