name: Unit Tests
permissions:
  contents: read
on:
  push:
    branches: [master, v2]
  pull_request:
  workflow_dispatch:
jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-native

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-native

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run native unit tests
        run: pio test -e native

  # The Follow web UI's pure logic and the dev mock server validate configs
  # against the same fixture the native suite does
  # (docs/spec/fixtures/follow-config-cases.json), so all three run in CI
  # to keep the three validators from drifting apart.
  follow-logic-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run follow-logic.js tests
        run: node --test test/follow-logic.test.js

  mock-server-py:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run mock_server.py validate_config() tests
        run: python3 test/test_mock_server.py
