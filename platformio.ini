; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
	targets/diy_espnow.ini
	targets/diy_lora.ini
	targets/legacy.ini
	targets/expresslrs.ini

[env]
framework = arduino
extra_scripts =
	pre:scripts/build_html.py # transforms the html/ directory into a C header file with data and a file with web server handlers to serve them
	pre:scripts/build_flags.py # adds dynamic flags from git data, etc.
	scripts/env_setup.py # patches PlatformIO OTA / compression methods
lib_deps =
	; For LoRa chips
	https://github.com/jgromes/RadioLib#45c5859338590b7eede23cb2f95284c3fb0cf08e
	; Web API and config. The esphome fork is the one v1 shipped and is the only
	; maintained build that works on both ESP32 and ESP8266 from one dependency.
	; We use no websocket, which is just as well: that fork's AsyncWebSocket is
	; missing the message-queue mutex that makes concurrent sends safe.
	ottowinter/ESPAsyncWebServer-esphome @ ^3.0.0
	bblanchon/ArduinoJson @ ^6.21.0
	; NOTE (v2 migration): the OLED driver and TinyGPSPlus return when the display
	; is ported; rweather/Crypto is gone for good, replaced by ff_core's own
	; AES-CCM so the cipher is identical on every platform and host-testable.

monitor_speed = 115200
upload_speed = 921600

; v2 migration: compile only the new event-driven firmware (main + hal adapters).
; The legacy globals-dependent managers under src/lib are excluded from the build
; until each is ported to the Node core; MSP framing now lives in lib/ff_core.
build_src_filter =
	-<*>
	+<main.cpp>
	+<hal/>

; Host-native environment for unit testing the pure logic in lib/ff_core.
; Deliberately overrides the firmware extra_scripts to empty so the Arduino
; build steps (html bundling, git flags, OTA patching) and hardware libraries
; are not pulled into the host build. ArduinoJson (header-only) is here solely
; for test/test_follow's cross-mirror fixture reader.
[env:native]
platform = native
framework =
test_framework = unity
extra_scripts =
lib_deps =
	bblanchon/ArduinoJson @ ^6.21.0
build_flags =
	-std=c++17
	-Wall
	-Wextra
	-I lib/ff_core
	-D UNITY_INCLUDE_DOUBLE
	-D UNITY_DOUBLE_PRECISION=1e-9

[env_common_esp32]
platform = espressif32@^5.2.0
board = esp32dev
;monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_ldf_mode = chain+
lib_deps =
	${env.lib_deps}
build_flags = 
	-D PLATFORM_ESP32

[env_common_esp32s2]
platform = espressif32@^5.2.0
board = esp32dev
board_build.mcu = esp32s2
board_build.f_cpu = 240000000L
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_deps =
	${env.lib_deps}
build_flags = 
	-D PLATFORM_ESP32
	-D WIFI_CONFIG

[env_common_esp82xx]
platform = espressif8266@^4.2.0
board = esp8285
;monitor_filters = esp8266_exception_decoder
lib_deps =
	${env.lib_deps}
build_flags = 
	-D PLATFORM_ESP8266
	-D WIFI_CONFIG

; ---------------------------------------------------------------------------
; LoRa bands.
;
; v2 is single-channel by design: ALOHA replaced the TDMA machine, and nothing
; in it hops. That has a regulatory consequence worth stating plainly, because
; it is the opposite of how ExpressLRS is allowed to operate. ELRS is legal in
; the US via the frequency-hopping route (FCC 15.247(a)(1)), which lets it use
; narrow channels. A fixed channel has to take the digital-modulation route,
; 15.247(a)(2), which requires a 6 dB bandwidth of at least 500 kHz. So the
; bandwidths here are chosen partly for link budget and partly because going
; narrower would put a fixed-channel system outside the rule ELRS never needed.
;
; Every channel below is placed to sit wholly inside its band with margin, away
; from the obvious congestion, and - for 2.4 GHz - away from our OWN ESP-NOW
; radio, which is on the same board a couple of centimetres from the antenna.
;
; LORA_DUTY_PCT is the regional duty-cycle ceiling, 0 for none. The rate
; controller treats it as a hard floor on the beacon interval, so a config that
; would transmit illegally is refused by the firmware rather than trusted to the
; person typing it (see rate_control.h).
;
; Spreading factor is chosen per band against its duty-cycle ceiling, not
; uniformly. Where there is no ceiling (915, 2400) airtime is cheap and it is
; worth spending on range. Where there is one (433, 868) every extra millisecond
; of airtime directly slows the beacon, and those bands are already the most
; sensitive of the four because their channels are narrower, so they stay at
; SF7 4/5.
;
; VERIFY THESE AGAINST THE RULES WHERE YOU FLY. They are researched defaults,
; not legal advice, and the allocations differ by region.

[env_common_433]
; 433.05-434.79 is the ITU Region 1 ISM allocation; in the US this is 70 cm,
; amateur-primary, so a licence is what makes it legal there. 434.4 keeps clear
; of 433.92, the default centre for essentially every cheap remote and doorbell.
; 250 kHz rather than 500: the whole band is only 1.74 MHz wide.
build_flags = 
	-D HAS_LORA
	-D LORA_FAMILY_SX127X
	-D LORA_BAND=433
	-D LORA_FREQUENCY=434400000
	-D LORA_BW_KHZ=250.0
	-D LORA_SF=7
	-D LORA_CR=5
	-D LORA_DUTY_PCT=10

[env_common_868]
; 869.40-869.65 is the only EU sub-band that permits 500 mW ERP and 10% duty,
; which makes it the only one that can carry a useful beacon rate. The previous
; 868.5 at 500 kHz spanned 868.25-868.75 and straddled the 868.6 boundary, so it
; sat in two sub-bands with different power and duty limits at once.
; 125 kHz fits inside 869.40-869.65 with margin; 250 would fill it edge to edge.
build_flags = 
	-D HAS_LORA
	-D LORA_FAMILY_SX127X
	-D LORA_BAND=868
	-D LORA_FREQUENCY=869525000
	-D LORA_BW_KHZ=125.0
	-D LORA_SF=7
	-D LORA_CR=5
	-D LORA_DUTY_PCT=10

[env_common_915]
; 902-928 US ISM. 915.000 was the worst available choice: dead centre of the
; band, inside the LoRaWAN US915 uplink block (902.3-914.9), and the frequency
; every other fixed-channel product defaults to. 920.0 sits in the gap between
; that uplink block and the LoRaWAN downlink block (923.3-927.5).
;
; SF8 rather than SF7, and 4/7: there is no duty-cycle ceiling here and the
; airtime is only 43 ms, so the 2.5 dB is nearly free. 902-928 is full of
; frequency-hopping traffic, which is burst interference, which is what the
; extra coding rate is for.
build_flags = 
	-D HAS_LORA
	-D LORA_FAMILY_SX127X
	-D LORA_BAND=915
	-D LORA_FREQUENCY=920000000
	-D LORA_BW_KHZ=500.0
	-D LORA_SF=8
	-D LORA_CR=7
	-D LORA_DUTY_PCT=0

[env_common_2400]
; 2400-2483.5 ISM. The previous 2400.000 centre put HALF the channel below the
; band edge, and sat directly on top of our own ESP-NOW radio: WiFi channel 1
; occupies roughly 2401-2423, on the same board. 2476.0 is inside the band with
; ~7 MHz of margin, above the top of US WiFi channel 11 (2473), and ~60 MHz
; clear of ESP-NOW on channel 1.
; 812.5 kHz rather than 406.25 so a fixed channel meets the 500 kHz minimum
; 6 dB bandwidth; that is not optional, so the link budget has to be found in
; the spreading factor instead.
;
; SF8, not SF5. 2.4 GHz is the weak link by a wide margin: at 10 dBm into a
; compromised antenna it was reaching about a sixth of the distance the sub-GHz
; bands do, partly from 8.6 dB more path loss than 915 MHz and partly from SF5
; being 7.5 dB less sensitive than SF8. SF8 puts it at -118.4 dBm, which is the
; same sensitivity class as the sub-GHz radios, for 27 ms of airtime.
;
; That trade is only affordable because of what ALOHA changed. There are no
; slots to keep, the rate controller sizes each radio's interval from its own
; airtime, and ESP-NOW carries the fast close-in updates - so LoRa can be the
; slow, long-range layer it should have been. Alone it beacons every 183 ms;
; with six nodes, about once a second.
;
; 4/7 rather than 4/5 because this band is full of WiFi. Coding rate does not
; move the demodulation floor at all - that is set by spreading factor and
; bandwidth - but it is what survives a burst of interference rather than a
; weak signal, and 26% more airtime is a fair price here.
build_flags = 
	-D HAS_LORA
	-D LORA_FAMILY_SX128X
	-D LORA_BAND=2400
	-D LORA_FREQUENCY=2476000000
	-D LORA_BW_KHZ=812.5
	-D LORA_SF=8
	-D LORA_CR=7
	-D LORA_DUTY_PCT=0
