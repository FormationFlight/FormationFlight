; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
	targets/diy_espnow.ini
	targets/diy_lora.ini
	targets/legacy.ini
	targets/expresslrs.ini

[env]
framework = arduino
extra_scripts =
	pre:scripts/build_html.py # transforms the html/ directory into a C header file with data and a file with web server handlers to serve them
	pre:scripts/build_flags.py # adds dynamic flags from git data, etc.
	scripts/env_setup.py # patches PlatformIO OTA / compression methods
lib_deps =
	; For LoRa chips
	https://github.com/jgromes/RadioLib#45c5859338590b7eede23cb2f95284c3fb0cf08e
	; NOTE (v2 migration): the OLED driver, rweather/Crypto, ESPAsyncWebServer,
	; ArduinoJson and TinyGPSPlus are reintroduced in later phases as the display,
	; crypto, web and direct-GPS subsystems are ported onto the Node core. They are
	; omitted now so the v2 firmware only pulls in what it actually compiles.

monitor_speed = 115200
upload_speed = 921600

; v2 migration: compile only the new event-driven firmware (main + hal adapters)
; and the reusable MSP protocol code. The legacy globals-dependent managers under
; src/lib are excluded from the build until each is ported to the Node core.
build_src_filter =
	-<*>
	+<main.cpp>
	+<hal/>
	+<lib/MSP/MSP.cpp>

; Host-native environment for unit testing the pure logic in lib/ff_core.
; Deliberately overrides the firmware extra_scripts and lib_deps to empty so the
; Arduino build steps (html bundling, git flags, OTA patching) and hardware
; libraries are not pulled into the host build.
[env:native]
platform = native
framework =
test_framework = unity
extra_scripts =
lib_deps =
build_flags =
	-std=c++17
	-Wall
	-Wextra
	-I lib/ff_core
	-D UNITY_INCLUDE_DOUBLE
	-D UNITY_DOUBLE_PRECISION=1e-9

[env_common_esp32]
platform = espressif32@^5.2.0
board = esp32dev
;monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv
monitor_speed = 921600
lib_ldf_mode = chain+
lib_deps =
	${env.lib_deps}
build_flags = 
	-D PLATFORM_ESP32

[env_common_esp32s2]
platform = espressif32@^5.2.0
board = esp32dev
board_build.mcu = esp32s2
board_build.f_cpu = 240000000L
board_build.partitions = min_spiffs.csv
monitor_speed = 921600
lib_deps =
	${env.lib_deps}
build_flags = 
	-D PLATFORM_ESP32
	-D WIFI_CONFIG

[env_common_esp82xx]
platform = espressif8266@^4.2.0
board = esp8285
;monitor_filters = esp8266_exception_decoder
lib_deps =
	${env.lib_deps}
build_flags = 
	-D PLATFORM_ESP8266
	-D WIFI_CONFIG

[env_common_433]
build_flags = 
	-D HAS_LORA
	-D LORA_FAMILY_SX127X
	-D LORA_BAND=433
	-D LORA_FREQUENCY=433375000

[env_common_868]
build_flags = 
	-D HAS_LORA
	-D LORA_FAMILY_SX127X
	-D LORA_BAND=868
	-D LORA_FREQUENCY=868500000

[env_common_915]
build_flags = 
	-D HAS_LORA
	-D LORA_FAMILY_SX127X
	-D LORA_BAND=915
	-D LORA_FREQUENCY=915000000

[env_common_2400]
build_flags = 
	-D HAS_LORA
	-D LORA_FAMILY_SX128X
	-D LORA_BAND=2400
	-D LORA_FREQUENCY=2400000000