[env:Unified_ESP32_LR1121_via_UART]
extends = env_common_esp32
build_flags =
	${env_common_esp32.build_flags}
	${env_lora_lr1121.build_flags}
	${env_unified.build_flags}

[env:Unified_ESP32_LR1121_via_WiFi]
