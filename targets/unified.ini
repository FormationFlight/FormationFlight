; Unified builds for ExpressLRS hardware.
;
; One image per chip and MCU, named after the ExpressLRS firmware it stands in
; for without the _RX: ELRS' Unified_ESP32C3_LR1121_RX is Unified_ESP32C3_LR1121
; here. No pins are compiled in, and no band: the board is described by its
; ExpressLRS layout (github.com/ExpressLRS/targets, the hardware/ submodule),
; appended to the image after the build, and the band is the radios.lora_band
; setting. List the boards these run on, and which env each one needs, with:
;
;   python scripts/elrs_targets.py list
;
; Then build and flash for one of them, naming the band it should boot on:
;
;   ELRS_TARGET=happymodel.rx_900.es900 ELRS_BAND=915 pio run -e Unified_ESP8285_900_via_UART -t upload
;
; or append the layout to an already-built image:
;
;   python scripts/elrs_targets.py configure happymodel.rx_900.es900 firmware.bin --band 915
;
; An SX1280 image needs no band; it only has one. A 900 or LR1121 image flashed
; without one boots with LoRa off and asks for one in the web UI, rather than
; guessing a band that is illegal in half the world. Built without a target at
; all, the image has no radio and no MSP and says so in its log; a
; /hardware.json uploaded to LittleFS also works, as it does in ELRS.

[env_unified]
build_flags =
	'-D CFG_TARGET_NAME="UNIFIED"'
	-D UNIFIED_TARGET

[env:Unified_ESP8285_900_via_UART]
extends = env_common_esp82xx
build_flags =
	${env_common_esp82xx.build_flags}
	${env_lora_sx127x.build_flags}
	${env_unified.build_flags}

[env:Unified_ESP8285_900_via_WiFi]
extends = env:Unified_ESP8285_900_via_UART

[env:Unified_ESP8285_2400_via_UART]
extends = env_common_esp82xx
build_flags =
	${env_common_esp82xx.build_flags}
	${env_lora_sx1280.build_flags}
	${env_unified.build_flags}

[env:Unified_ESP8285_2400_via_WiFi]
extends = env:Unified_ESP8285_2400_via_UART

[env:Unified_ESP32_900_via_UART]
extends = env_common_esp32
build_flags =
	${env_common_esp32.build_flags}
	${env_lora_sx127x.build_flags}
	${env_unified.build_flags}

